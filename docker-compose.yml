# Local Postgres for development and the end-to-end test.
#   npm run db:start    start it and apply migrations
#   npm run db:stop     stop it (data is kept)
#   npm run db:reset    wipe it and start fresh
services:
  db-dev:
    image: postgres:18.4
    container_name: postgres-18-4-docker-singudoc-api
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: signudoc_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d signudoc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local mailbox for development. SignuDoc sends SMTP to port 1025;
  # open http://localhost:8025 to read what arrived.
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: pci-mailpit-container
    ports:
      - "8026:8025"   # web UI
      - "1026:1025"   # SMTP
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      start_period: 10s

volumes:
  pgdata:
    driver: local
  mailpit_data:
    driver: local
